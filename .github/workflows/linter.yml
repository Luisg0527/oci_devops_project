---
name: Super-Linter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  super-linter:
    name: Lint with Super-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Super-Linter
        uses: super-linter/super-linter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
          LINTER_RULES_PATH: .github/linters
          JAVA_FILE_NAME: java_checks.xml
          JAVASCRIPT_ES_CONFIG_FILE: .eslintrc.json
          TERRAFORM_TFLINT_CONFIG_FILE: .tflint.hcl
          # Exclude local tooling paths if they appear in the tree
          FILTER_REGEX_EXCLUDE: '(.*[/\\]\.venv[/\\].*)|(.*[/\\]node_modules[/\\].*)'
          # Opt-in: only these validators run (see .github/linters/)
          VALIDATE_JAVA: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_JSX: true
          VALIDATE_CSS: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true
          VALIDATE_XML: true
          VALIDATE_ENV: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_BASH: true
          VALIDATE_TERRAFORM_FMT: true
          VALIDATE_TERRAFORM_TFLINT: true
