version: 0.1 
component: build
timeoutInSeconds: 1800
shell: bash

env:
  variables:
    JAVA_HOME: /usr/lib64/graalvm/graalvm-java22
    JMETER_VERSION: "5.6.3"
    LOAD_TEST_USERS: "25"
    LOAD_TEST_RAMPUP: "120"
    LOAD_TEST_DURATION: "600"
    LOAD_TEST_PROJECT_ID: "1"
    LOAD_TEST_SPRINT_ID: "1"

  exportedVariables:
    - BuildServiceDemoVersion

steps:
  - type: Command
    name: "Install GraalVM Enterprise 22.x Native Image for Java22"
    command:  yum -y install graalvm-22-jdk.x86_64;
              ls /usr/lib64/graalvm/

  - type: Command
    name: "Docker Login"
    command:  export PATH=$JAVA_HOME/bin:$PATH;
              cd MtdrSpring;
              oci os object get --bucket-name reacttodo-zofjd --name deployment_config.tgz --file deployment_config.tgz;
              tar -xzvf deployment_config.tgz;
              source env.sh;
              cat at.cfg | docker login -u "axaed6pbpegg/a00839388@tec.mx" --password-stdin mx-queretaro-1.ocir.io

  - type: Command
    name: "Build"
    command:  export PATH=$JAVA_HOME/bin:$PATH;
              cd MtdrSpring;
              source env.sh;
              (cd backend;source build.sh)

  - type: Command
    name: "Load Test with JMeter"
    command:  if [ -z "$LOAD_TEST_BASE_URL" ]; then
                echo "SKIP: LOAD_TEST_BASE_URL not set — load test omitted.";
                exit 0;
              fi;
              if [ -z "$LOAD_TEST_PASSWORD" ]; then
                echo "ERROR: LOAD_TEST_PASSWORD must be set when LOAD_TEST_BASE_URL is set.";
                exit 1;
              fi;
              cd load-tests/jmeter;
              chmod +x run-load-test.sh;
              ./run-load-test.sh



