# ── LLM (Ollama local, API OpenAI-compatible) ─────────────────────────────────
# Ollama expone /v1/chat/completions compatible con OpenAI: GroqClient lo consume
# sin cambios. La "key" es un placeholder (Ollama no autentica). Overridable por env.
groq.api-key=${GROQ_API_KEY:ollama}
groq.api-url=${GROQ_API_URL:http://localhost:11434/v1/chat/completions}
groq.model=${GROQ_MODEL:llama3.2}
groq.timeout-ms=60000
groq.max-context-chars=25000

# ── Embeddings (Ollama local, nomic-embed-text = 768 dims) ────────────────────
# Reusa el namespace gemini.* — OllamaEmbeddingClient (@Primary) lo consume.
# Tras cambiar de modelo de embeddings, re-indexar Qdrant.
gemini.api-key=${GEMINI_API_KEY:ollama}
gemini.api-url=${GEMINI_API_URL:http://localhost:11434}
gemini.model=${GEMINI_MODEL:nomic-embed-text}
gemini.dimensions=768
gemini.batch-size=20
gemini.timeout-ms=30000

# ── Qdrant vector DB self-hosted (HTTP REST API on :6333) ─────────────────────
# OKE default: http://qdrant:6333 | Local Docker: http://localhost:6333
qdrant.base-url=${QDRANT_URL:http://localhost:6333}
qdrant.api-key=${QDRANT_API_KEY:}
qdrant.collection=${QDRANT_COLLECTION:project_context}
qdrant.timeout-ms=10000

# ── RAG pipeline ──────────────────────────────────────────────────────────────
# When enabled, /ai/chat retrieves top-K context from Qdrant.
# Falls back to the full snapshot if Qdrant/Gemini are unavailable.
rag.enabled=${RAG_ENABLED:true}
rag.top-k=20
rag.hydrated-limit=4
rag.bootstrap-on-startup=${RAG_BOOTSTRAP:true}

# ── Observabilidad: Actuator + métricas Prometheus ───────────────────────────
# Endpoints expuestos para monitoreo/gestión (Criterio: métricas + health).
#   - /actuator/health                 estado global
#   - /actuator/health/liveness        liveness probe (K8s)
#   - /actuator/health/readiness       readiness probe (K8s)
#   - /actuator/prometheus             métricas en formato Prometheus
#   - /actuator/metrics                catálogo de métricas
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.show-details=when_authorized
# Etiqueta común para todas las métricas (facilita filtrar por app en Prometheus/Grafana)
management.metrics.tags.application=mytodolist-sprintly
info.app.name=MyTodoList / Sprintly
info.app.description=API de gestión de proyectos con asistente de IA (RAG) y bot de Telegram

# ── Logging ───────────────────────────────────────────────────────────────────
# Cloud-native (12-Factor XI): los logs se emiten a stdout y los recolecta la
# plataforma (OCI Logging / kubectl logs). No se escribe a archivo.
logging.level.org.springdoc=INFO
logging.level.org.hibernate.SQL=INFO
