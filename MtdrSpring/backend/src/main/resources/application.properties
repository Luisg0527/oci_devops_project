# ── Oracle DataSource (ATP / XEPDB1) ─────────────────────────────────────────
# When deployed in Kubernetes these are overridden via env vars / secrets.
# For local testing uncomment and set the values below:
spring.datasource.url=${db_url:jdbc:oracle:thin:@reacttodoqk8zv_low?TNS_ADMIN=src/main/resources/Wallet_reacttodoqk8zv}
spring.datasource.username=${db_user:EQUIPO65}
spring.datasource.password=${dbpassword:MalkotoCon123!}
spring.datasource.driver-class-name=${driver_class_name:oracle.jdbc.OracleDriver}

# ── Hibernate / JPA ──────────────────────────────────────────────────────────
# ddl-auto=none: schema is managed by DB/schema.sql, not Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Oracle UCP connection pool ────────────────────────────────────────────────
spring.datasource.type=oracle.ucp.jdbc.PoolDataSource
spring.datasource.oracleucp.connection-factory-class-name=oracle.jdbc.pool.OracleDataSource
spring.datasource.oracleucp.sql-for-validate-connection=select * from dual
spring.datasource.oracleucp.connection-pool-name=connectionPoolName1
spring.datasource.oracleucp.initial-pool-size=15
spring.datasource.oracleucp.min-pool-size=10
spring.datasource.oracleucp.max-pool-size=30

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=Y2hhbmdlLXRoaXMtdG8tYS1sb25nLXNlY3VyZS1yYW5kb20tc2VjcmV0LWtleS1pbi1wcm9kdWN0aW9u
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000

# ── Server ────────────────────────────────────────────────────────────────────
# Keep frontend static resources at "/" and apply API base-path in MVC config.

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.api-docs.path=/v3/api-docs

# ── Telegram bot ──────────────────────────────────────────────────────────────
telegram.bot.token=8553466788:AAHizTFZVUSHtROKy7IFcKnbcPz7YtOcKj0
telegram.bot.name=estafan_bot

# ── Groq AI (chatbot Sprintly) ────────────────────────────────────────────────
# Usa env var GROQ_API_KEY en prod (K8s secret). En dev pon tu key real aquí.
groq.api-key=${GROQ_API_KEY:}
groq.api-url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile
groq.timeout-ms=20000
groq.max-context-chars=120000

# ── Embeddings (Google Gemini text-embedding-004, free tier) ──────────────────
gemini.api-key=${GEMINI_API_KEY:}
gemini.api-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=models/text-embedding-004
gemini.dimensions=768
gemini.batch-size=100
gemini.timeout-ms=15000

# ── Qdrant vector DB (HTTP REST API on :6333) ────────────────────────────────
qdrant.base-url=${QDRANT_URL:http://qdrant:6333}
qdrant.api-key=${QDRANT_API_KEY:}
qdrant.collection=${QDRANT_COLLECTION:project_context}
qdrant.timeout-ms=10000

# ── RAG pipeline ──────────────────────────────────────────────────────────────
# When enabled, /ai/chat retrieves top-K context from Qdrant + mini snapshot.
# Falls back to the full snapshot if Qdrant/Gemini are unavailable.
rag.enabled=${RAG_ENABLED:true}
rag.top-k=20
rag.hydrated-limit=8
rag.bootstrap-on-startup=${RAG_BOOTSTRAP:true}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.springdoc=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.file.name=logs.log
